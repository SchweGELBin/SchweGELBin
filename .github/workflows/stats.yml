name: GitHub Profile Stats

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE: "username=${{ github.repository_owner }}&theme=catppuccin_mocha"
  OUT: "profile"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats (basic)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.BASE }}&show_icons=true&number_format=long
          path: ${{ env.OUT }}/stats-basic.svg

      - name: Generate stats (full)
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: ${{ env.BASE }}&show_icons=true&number_format=long&include_all_commits=true&show=discussions_answered,discussions_started,prs_merged,prs_merged_percentage,reviews
          path: ${{ env.OUT }}/stats-full.svg

      - name: Generate top-langs
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: ${{ env.BASE }}&langs_count=6&layout=pie
          path: ${{ env.OUT }}/top-langs.svg
     
      - name: Update repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add ${{ env.OUT }}/*.svg
          git commit -m "profile: update cards" || exit 0
          git push
